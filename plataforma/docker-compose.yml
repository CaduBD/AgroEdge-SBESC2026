services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      # A pasta inteira (e não arquivo por arquivo): o mosquitto_passwd reescreve o
      # passwd trocando o arquivo, o que quebraria um bind mount de arquivo único.
      - ./mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app_data:/data
    depends_on:
      - mosquitto
    # O CMD da imagem roda "alembic upgrade head" antes do Uvicorn.

volumes:
  mosquitto_data:
  app_data:
