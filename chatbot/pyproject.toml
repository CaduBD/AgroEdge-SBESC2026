[project]
name = "agroedge-chatbot"
version = "0.1.0"
description = "Chatbot do AgroEdge: leva ao produtor, pelo Telegram, o que a placa calcula."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",  # fuso America/Bahia no Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
agroedge-bot = "agroedge_bot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agroedge_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
