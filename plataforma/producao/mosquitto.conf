# Mosquitto de produção (VPS). O de desenvolvimento é o mosquitto/mosquitto.conf.
# Usuários e permissões são os mesmos: mosquitto/passwd (gerar_passwd.py) e mosquitto/acl.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Interno: o backend, pela rede do Docker. Esta porta NÃO é publicada no servidor.
listener 1883 0.0.0.0

# Placas, pela internet, só com TLS. Certificado do Let's Encrypt tirado pelo Caddy para
# mqtt.<domínio> e copiado por producao/mosquitto-entrada.sh.
listener 8883 0.0.0.0
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem
tls_version tlsv1.2
max_connections 500

# Limites contra abuso (uma placa manda lotes de até 50 leituras: poucos KB)
max_packet_size 262144
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 300

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
